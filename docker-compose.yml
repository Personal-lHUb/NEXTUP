services:
  db:
    image: postgres:16-alpine
    container_name: nextup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextup
      POSTGRES_PASSWORD: nextup
      POSTGRES_DB: nextup
    ports:
      - "5432:5432"
    volumes:
      - nextup-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextup"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object store for blinded source files (dev).
  minio:
    image: minio/minio:latest
    container_name: nextup-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nextup
      MINIO_ROOT_PASSWORD: nextup-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - nextup-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nextup-pgdata:
  nextup-minio:
