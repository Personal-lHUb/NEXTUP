services:
  db:
    image: postgres:16-alpine
    container_name: nextup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextup
      POSTGRES_PASSWORD: nextup
      POSTGRES_DB: nextup
    ports:
      - "5432:5432"
    volumes:
      - nextup-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextup"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nextup-pgdata:
